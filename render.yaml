services:
  - type: web
    name: liquidity-risk-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CORS_ORIGINS
        sync: false   # set this manually in Render dashboard to your Vercel URL
